name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  skill-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md frontmatter
        run: |
          python3 - <<'EOF'
          import re, sys
          with open('SKILL.md', 'r') as f:
              content = f.read()
          match = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
          if not match:
              print('ERROR: SKILL.md missing valid frontmatter')
              sys.exit(1)
          fm = match.group(1)
          if 'name:' not in fm:
              print('ERROR: SKILL.md frontmatter missing name field')
              sys.exit(1)
          if 'description:' not in fm:
              print('ERROR: SKILL.md frontmatter missing description field')
              sys.exit(1)
          print('SKILL.md frontmatter valid')
          EOF

      - name: Validate hook files
        run: |
          test -f hooks/phosphene-awakening/hook.yaml || (echo "ERROR: hook.yaml missing" && exit 1)
          test -f hooks/phosphene-awakening/handler.py || (echo "ERROR: handler.py missing" && exit 1)
          python3 hooks/phosphene-awakening/handler.py 2>/dev/null || true
          echo "Hook files present"
